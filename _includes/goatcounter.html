{% if site.goatcounter %}
<!-- GoatCounter: cookieless analytics. Counts pageviews, referrers, campaign
     tags, country, browser and screen size. Sets no cookies and stores no IPs,
     so it needs no consent banner. -->
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{% endif %}
